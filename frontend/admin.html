<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel · KG Espaço Saúde</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0c0c0d">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230c0c0d'/%3E%3Ctext x='32' y='42' font-family='Georgia,serif' font-size='28' font-style='italic' fill='%23d4af37' text-anchor='middle'%3EKG%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500;1,600&family=Work+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="painel">

<!-- Login -->
<main class="login" id="tela-login" hidden>
  <div class="login-card">
    <img class="login-logo" src="assets/kg-logo-transparente.png" alt="KG Espaço Saúde e Bem-Estar" width="600" height="495">
    <p class="sub">Painel de agendamentos</p>
    <form id="form-login" class="card">
      <label class="field">
        <span>E-mail</span>
        <input name="email" type="email" autocomplete="username" required>
      </label>
      <label class="field">
        <span>Senha</span>
        <input name="senha" type="password" autocomplete="current-password" required>
      </label>
      <p class="alert" id="erro-login" role="alert" hidden></p>
      <button class="btn btn-primary" type="submit">Entrar</button>
    </form>
  </div>
</main>

<!-- Painel -->
<div class="app" id="tela-painel" hidden>
  <aside class="sidebar">
    <div class="brand">
      <img src="assets/kg-logo-transparente.png" alt="" width="600" height="495">
      <div class="brand-text"><strong>KG Espaço</strong><span>Painel</span></div>
    </div>
    <nav class="nav" id="nav" aria-label="Seções do painel"></nav>
    <div class="sidebar-footer">
      <span class="quem" id="usuario"></span>
      <div class="links">
        <a class="btn btn-ghost btn-sm site" href="index.html" target="_blank" rel="noopener">Ver site</a>
        <button class="btn btn-ghost btn-sm" id="sair" type="button">Sair</button>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="main-inner" id="conteudo" aria-live="polite"></div>
  </main>
</div>

<div id="gaveta"></div>

<script type="module" src="js/painel/painel.js"></script>
</body>
</html>
