<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel · KG Espaço Saúde</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0c0c0d">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230c0c0d'/%3E%3Ctext x='32' y='42' font-family='Georgia,serif' font-size='28' font-style='italic' fill='%23d4af37' text-anchor='middle'%3EKG%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500;1,600&family=Work+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<!-- Login -->
<main class="wrap login" id="tela-login" hidden>
  <p class="brand">KG Espaço Saúde</p>
  <p class="sub">Painel de agendamentos</p>
  <form id="form-login" class="card">
    <label class="field">
      <span>E-mail</span>
      <input name="email" type="email" autocomplete="username" required>
    </label>
    <label class="field">
      <span>Senha</span>
      <input name="senha" type="password" autocomplete="current-password" required>
    </label>
    <p class="alert" id="erro-login" role="alert" hidden></p>
    <button class="btn btn-primary" type="submit">Entrar</button>
  </form>
</main>

<!-- Painel -->
<main class="wrap" id="tela-painel" hidden>
  <div class="topbar">
    <h1>Painel</h1>
    <button class="btn btn-ghost btn-sm" id="sair" type="button">Sair</button>
  </div>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" aria-selected="true" aria-controls="aba-agenda" data-aba="aba-agenda" type="button">Agenda</button>
    <button class="tab" role="tab" aria-selected="false" aria-controls="aba-bloqueios" data-aba="aba-bloqueios" type="button">Folgas e bloqueios</button>
  </div>

  <section id="aba-agenda" role="tabpanel">
    <div class="day-nav">
      <button class="back" id="dia-anterior" type="button" aria-label="Dia anterior">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <span class="label" id="dia-label"></span>
      <button class="back" id="dia-seguinte" type="button" aria-label="Próximo dia">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
      </button>
    </div>
    <div class="filters">
      <button class="chip" id="filtro-hoje" type="button" aria-pressed="false">Hoje</button>
      <button class="chip" id="filtro-proximos" type="button" aria-pressed="false">Todos os próximos</button>
      <button class="chip" id="filtro-pendentes" type="button" aria-pressed="false">Só pendentes</button>
    </div>
    <p class="alert" id="erro-agenda" role="alert" hidden></p>
    <div class="bookings" id="lista-agendamentos" aria-live="polite"></div>
  </section>

  <section id="aba-bloqueios" role="tabpanel" hidden>
    <form id="form-bloqueio" class="card">
      <label class="field">
        <span>Data</span>
        <input name="data" type="date" required>
      </label>
      <label class="check">
        <input name="diaInteiro" type="checkbox" checked>
        Dia inteiro
      </label>
      <div class="row" id="campos-horario" hidden>
        <label class="field">
          <span>Das</span>
          <input name="inicio" type="time" step="1800" value="09:00">
        </label>
        <label class="field">
          <span>Até</span>
          <input name="fim" type="time" step="1800" value="12:00">
        </label>
      </div>
      <label class="field">
        <span>Motivo (opcional)</span>
        <input name="motivo" maxlength="120" placeholder="Folga, curso, consulta…">
      </label>
      <p class="alert" id="erro-bloqueio" role="alert" hidden></p>
      <button class="btn btn-primary" type="submit" style="width:100%">Bloquear horário</button>
    </form>
    <div class="blocks" id="lista-bloqueios"></div>
  </section>
</main>

<script type="module" src="js/admin.js"></script>
</body>
</html>
