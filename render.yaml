# Blueprint do Render: New → Blueprint → apontar para este repositório.
# Os valores marcados com sync: false são pedidos no painel na primeira vez.
services:
  - type: web
    name: kg-espaco-saude
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false # connection string do Neon
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Começa em "manual" (chave Pix + comprovante no WhatsApp). Quando a conta do
      # Mercado Pago estiver pronta: trocar para "mercado_pago" e preencher o token.
      - key: PAGAMENTO_PROVEDOR
        value: manual
      - key: MERCADO_PAGO_ACCESS_TOKEN
        sync: false
      - key: MERCADO_PAGO_WEBHOOK_SECRET
        sync: false
      - key: URL_PUBLICA
        sync: false # ex: https://kg-espaco-saude.onrender.com
      - key: CORS_ORIGINS
        sync: false # ex: ["https://kg-espaco-saude.onrender.com"]
